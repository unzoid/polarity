name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR replaces its running checks; every commit on
# master keeps its own run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# ui/mobile-polish (temporary): only the iOS build runs there, for a test IPA; drop this before merging.

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    if: github.ref != 'refs/heads/ui/mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # a new Bun release can't break --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # A release build has none of the dev-only parts (dev database, watch log), and a dev build has them all (#425).
      - name: Release bundle leaves out dev-only parts
        run: bun scripts/releaseBundle.ts

  # The browser extension (extension/, #208): its own tests, typecheck and build;
  # the Chrome and Firefox folders are kept for loading unpacked.
  extension:
    name: Browser extension (tests, typecheck, build)
    if: github.ref != 'refs/heads/ui/mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: extension
      - run: bunx tsc --noEmit -p extension
      - run: bun run build
        working-directory: extension
      - name: Keep the built extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-extension
          path: extension/dist/
          retention-days: 14

  # The web build in real browsers against the fake shell (playwright.config.ts):
  # desktop in Chromium and WebKit, TV and phone sizes in Chromium. In two halves side by side (#481): the whole
  # suite on one runner took 20 minutes and a slow runner nearly twice that, past the time limit with every test
  # passing. Each half takes about half, which leaves a slow runner room under the same limit.
  e2e-web:
    name: End to end (web build, ${{ matrix.shard }}/2)
    if: github.ref != 'refs/heads/ui/mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Playwright's own image for the version in bun.lock (1.64.1), pinned by digest: the browsers'
    # system packages are already installed, so no run depends on Ubuntu's package mirror. Running
    # as the runner's user (1001) follows Playwright's guide for GitHub Actions. When @playwright/test
    # is updated, this image and its digest are updated with it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun needs unzip, which Playwright's image doesn't have; the image has Node and npm, so
      # the same Bun version comes from npm instead, into the job's temporary folder.
      - name: Install Bun
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/bun" bun@1.4.4
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p e2e
      # The image already carries the browsers and their system packages; this only checks that the
      # browsers match the installed Playwright and fetches them if not. Each attempt gets 5 minutes,
      # and a stalled one is tried again.
      - name: Install the browsers
        run: |
          for attempt in 1 2 3; do
            timeout 300 bunx playwright install chromium webkit && exit 0
            echo "::warning::Installing the browsers failed or stalled (attempt $attempt of 3)"
          done
          exit 1
      - run: bun run e2e --shard=${{ matrix.shard }}/2
      # Also when the time limit stops the job, so what failed before then can be read.
      - name: Keep the report, traces and screenshots
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14

  rust:
    name: Rust tests (${{ matrix.os }})
    if: github.ref != 'refs/heads/ui/mobile-polish'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      # Caches are saved from master only and restored everywhere: one copy per cache keeps the
      # repository under GitHub's 10 GB, so they aren't evicted and pull requests start warm.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Linux: the web view (WebKitGTK) and what tauri and gilrs link against.
      # mpv runs as its own process there, so nothing of it is linked.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          scripts/ci-apt.sh --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev
      # Debug builds (tests, clippy) don't embed the frontend, so no `dist` is
      # needed. On Windows tauri-build does need the bundled mpv files listed in
      # tauri.windows.conf.json; macOS loads an installed libmpv at runtime.
      # The mpv.exe windows-mpv.yml built for this version, or empty stand-ins
      # while it hasn't yet: nothing here plays video.
      - name: Version of the Windows mpv
        if: runner.os == 'Windows'
        id: mpv
        shell: bash
        run: echo "key=$(cat scripts/windows-mpv.sh scripts/windows-mpv.lock | tr -d '\r' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the Windows mpv
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv/out
          key: windows-mpv-${{ steps.mpv.outputs.key }}
          enableCrossOsArchive: true
      - name: Put mpv in the app
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/vendor-mpv.sh windows-mpv/out
      - run: cargo test --workspace --locked
      - run: cargo build -p polar-index --features server --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The Android app (src-tauri/gen/android, docs/plan-mobile.md §2) as a debug
  # APK for the emulator (x86_64) and phones (aarch64), and as an unsigned
  # release APK and bundle. Debug builds carry Android's throwaway debug key;
  # release signing waits for the owner's key.
  # The runner image has the Android SDK and NDKs; the platform the project
  # compiles against is installed here in case the image lags behind it.
  # libmpv and FFmpeg (scripts/android-mpv.sh, docs/plan-mobile.md §7) are
  # built once and kept until the script, and so a pinned version, changes;
  # the sources they're built from are kept with the APK.
  android:
    name: Android build (debug and unsigned release)
    if: github.ref != 'refs/heads/ui/mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      # Caches are saved from master only and restored everywhere: one copy per cache keeps the
      # repository under GitHub's 10 GB, so they aren't evicted and pull requests start warm.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the Android platform
        run: |
          sdk="$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)"
          # `yes` ends on SIGPIPE, which pipefail would count as a failure.
          # From API 37 on, platform packages carry a minor version (platforms;android-37.0).
          pkg="platforms;android-$sdk"; [ "$sdk" -ge 37 ] && pkg="$pkg.0"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$pkg"
      # The runner image's newest NDK is a shell variable there, not part of the workflow's `env`
      # context (so `${{ env.ANDROID_NDK_LATEST_HOME }}` is empty); hand it to the later steps.
      - name: Use the runner's NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?the runner image has no Android NDK}}" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libmpv/out
          key: android-libmpv-${{ hashFiles('scripts/android-mpv.sh') }}
      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          scripts/ci-apt.sh autoconf pkgconf libtool ninja-build gperf nasm
          pipx install meson
          scripts/android-mpv.sh "$RUNNER_TEMP/libmpv" arm64 armv7 x86_64
      - name: Put libmpv in the app
        run: cp -R "$RUNNER_TEMP/libmpv/out/jniLibs" "$RUNNER_TEMP/libmpv/out/assets" src-tauri/gen/android/app/src/main/
      # Pull requests build the debug APK for arm64 only (what phones run); master builds x86_64, arm64
      # and armv7 (32-bit TV dongles such as the Chromecast with Google TV, #442). The emulator test in
      # e2e-app.yml builds its own x86_64 APK.
      # The account backend (scripts/accountEnv.ts), so the APK has sign-in: master and tags only. Other branches
      # (dev too) and pull requests build without it, so no artifact outside a release carries production's settings.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && secrets.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
        run: bun run tauri android build --ci --debug --apk ${{ github.ref == 'refs/heads/master' && '--target x86_64 --target aarch64 --target armv7' || '--target aarch64' }}
      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14
      # The unsigned release APK and app bundle are built on master only.
      - name: Build the release (unsigned)
        if: github.ref == 'refs/heads/master'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run tauri android build --ci --apk --aab --target x86_64 --target aarch64 --target armv7
      - name: Keep the release
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-unsigned
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
      - name: Keep libmpv's sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-mpv-sources
          path: ${{ runner.temp }}/libmpv/out/polarity-android-mpv-sources.tar.xz
          compression-level: 0
          retention-days: 14

  # The iOS app (docs/plan-mobile.md §3) as an unsigned IPA for iPhones and iPads; signing waits
  # for the owner's Apple developer account. Its Xcode project isn't kept in git: `tauri ios init`
  # generates it from tauri.conf.json and tauri.ios.conf.json, then the app icon is put in.
  # libmpv and FFmpeg (LGPL builds, scripts/ios-mpv.sh, docs/plan-mobile.md §7) are built once
  # and kept until the script, and so a pinned version, changes; the sources they're built from
  # are kept with the IPA.
  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The iOS 26 SDK gives the system controls (the tab bar, src-tauri/src/ios/tabs.m) their Liquid
      # Glass look on iOS 26; the app still runs from iOS 17 (tauri.ios.conf.json).
      - name: Use Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)
          case "$(basename "$xcode")" in Xcode_2[6-9]*|Xcode_[3-9][0-9]*) ;; *) echo "::error::no Xcode 26 or later here"; ls -d /Applications/Xcode*.app; exit 1 ;; esac
          sudo xcode-select -s "$xcode"
          echo "$xcode: iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install build tools
        run: brew install meson ninja pkgconf xcodegen
      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-libmpv/out
          key: ios-libmpv-${{ hashFiles('scripts/ios-mpv.sh') }}
      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: scripts/ios-mpv.sh "$RUNNER_TEMP/ios-libmpv" device
      - name: Put libmpv in the app
        run: |
          mkdir -p src-tauri/vendor/ios
          cp -R "$RUNNER_TEMP/ios-libmpv/out/frameworks" "$RUNNER_TEMP/ios-libmpv/out/licenses" src-tauri/vendor/ios/
      - name: Generate the Xcode project
        run: |
          bun run tauri ios init --ci
          bun run tauri icon src-tauri/icons/icon.png --output "$RUNNER_TEMP/icons"
          cp "$RUNNER_TEMP"/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
      # The account backend: master and tags only, as for the APK. ui/mobile-polish's test IPA (temporary, with the
      # rest of this branch's CI) is a dev build instead, with no database built in: a tester connects one with a
      # connection code in Settings → Advanced → Database (src/lib/account/devDatabase.ts).
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && secrets.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
          VITE_POLAR_CHANNEL: ${{ github.ref == 'refs/heads/ui/mobile-polish' && 'dev' || '' }}
        run: bun run tauri ios build --ci --no-sign
      - name: Keep the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-ipa
          path: src-tauri/gen/apple/build/**/*.ipa
          retention-days: 14
      - name: Keep libmpv's sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-mpv-sources
          path: ${{ runner.temp }}/ios-libmpv/out/polarity-ios-mpv-sources.tar.xz
          compression-level: 0
          retention-days: 14

  # Revyl requires a simulator-slice app, not the device IPA above. Keep this
  # branch-only so normal iOS releases don't pay for the extra simulator build.
  ios-simulator:
    name: iOS Simulator build (arm64, debug)
    if: github.ref == 'refs/heads/ui/mobile-polish'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)
          case "$(basename "$xcode")" in Xcode_2[6-9]*|Xcode_[3-9][0-9]*) ;; *) echo "::error::no Xcode 26 or later here"; ls -d /Applications/Xcode*.app; exit 1 ;; esac
          sudo xcode-select -s "$xcode"
          echo "$xcode: iOS Simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios-simulator
          save-if: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install build tools
        run: brew install meson ninja pkgconf xcodegen
      - name: Restore simulator libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-libmpv/out
          key: ios-libmpv-simulator-${{ hashFiles('scripts/ios-mpv.sh') }}
      - name: Build simulator libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: scripts/ios-mpv.sh "$RUNNER_TEMP/ios-libmpv" simulator
      - name: Put libmpv in the app
        run: |
          mkdir -p src-tauri/vendor/ios
          cp -R "$RUNNER_TEMP/ios-libmpv/out/frameworks" "$RUNNER_TEMP/ios-libmpv/out/licenses" src-tauri/vendor/ios/
      - name: Generate the Xcode project
        run: |
          bun run tauri ios init --ci
          bun run tauri icon src-tauri/icons/icon.png --output "$RUNNER_TEMP/icons"
          cp "$RUNNER_TEMP"/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
      - name: Build simulator app
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: bun run tauri ios build --ci --no-sign --debug --target aarch64-sim
      - name: Verify simulator app slice
        shell: bash
        run: |
          set -euo pipefail
          app=src-tauri/gen/apple/build/arm64-sim/Polarity.app
          binary="$app/Polarity"
          test -d "$app"
          test -f "$binary"
          archs=$(lipo -archs "$binary")
          [[ " $archs " == *" arm64 "* ]]
          xcrun vtool -show-build "$binary" | grep -q 'platform IOSSIMULATOR'
      - name: Package simulator app
        run: ditto -c -k --keepParent src-tauri/gen/apple/build/arm64-sim/Polarity.app Polarity-iOS-simulator-arm64.app.zip
      - name: Keep simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: Polarity-iOS-simulator-arm64.app.zip
          retention-days: 14
      - name: Keep libmpv's simulator sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-mpv-sources
          path: ${{ runner.temp }}/ios-libmpv/out/polarity-ios-mpv-sources.tar.xz
          compression-level: 0
          retention-days: 14


  fmt:
    name: Rust formatting
    if: github.ref != 'refs/heads/ui/mobile-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

name: Dev build

# Every push to `dev` builds the desktop installers release.yml builds, as a dev build, and
# publishes them in the one rolling pre-release "Dev build" (tag `dev`), with the dev channel's
# latest.json; the Android APK is kept as a workflow artifact (docs/dev-channel.md).
#
#   Version:  X.Y.(Z+1)-dev.N after the newest vX.Y.Z tag, N the run number (scripts/devChannel.ts).
#   Files:    named platform first, then build number (Polarity-Dev-Windows-x64-0057-setup.exe).
#   Updates:  dev builds check the "Dev build" entry only, with their own key; release builds
#             never see it. The entry keeps this build and the previous 10 for going back.
#   Database: none built in. A dev build connects to one from a pasted connection code.
#   App:      "Polarity Dev" (polarity-dev, app.getpolar.desktop.dev, polarity-dev://), its own app
#             next to the released Polarity: own install folder, data, settings and keychain entries.
#
# Needs the dev updater key (not the release one): repository secrets DEV_UPDATER_PRIVATE_KEY and
# DEV_UPDATER_PRIVATE_KEY_PASSWORD, and its public key as the repository variable
# DEV_UPDATER_PUBLIC_KEY (`bun tauri signer generate`, docs/dev-channel.md). Discord: the
# "Polarity Dev" application's id as the repository variable DEV_DISCORD_CLIENT_ID (optional).
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # scripts/fetch-mpv.ts downloads windows-mpv.yml's build

# One publish at a time, in push order; a build is never cancelled half-published.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  meta:
    name: Version
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, for the version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check the dev updater key is set
        env:
          KEY: ${{ secrets.DEV_UPDATER_PRIVATE_KEY }}
          PUBKEY: ${{ vars.DEV_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ -z "$KEY" || -z "$PUBKEY" ]]; then
            echo "::error::Add the DEV_UPDATER_PRIVATE_KEY secret and the DEV_UPDATER_PUBLIC_KEY variable (Settings → Secrets and variables → Actions; docs/dev-channel.md)."
            exit 1
          fi
      - name: Work out the version
        id: v
        run: |
          echo "version=$(bun scripts/devChannel.ts version "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest # Apple Silicon
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DEV_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DEV_UPDATER_PRIVATE_KEY_PASSWORD }}
      # src/lib/platform/build.ts and src-tauri/src/dev_channel.rs read it.
      VITE_POLAR_CHANNEL: dev
      VERSION: ${{ needs.meta.outputs.version }}
      # The dev app's own Discord application, "Polarity Dev" (src-tauri/src/discord.rs). Unset, the
      # dev build doesn't connect to Discord at all.
      POLAR_DISCORD_CLIENT_ID: ${{ vars.DEV_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
          save-if: false # release.yml's cache, read only
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The dev app's own name, identifier and link scheme (installed next to the released Polarity),
      # the version, the dev feed and the dev public key, over tauri.conf.json.
      - name: Dev build settings
        env:
          PUBKEY: ${{ vars.DEV_UPDATER_PUBLIC_KEY }}
        run: bun scripts/devChannel.ts conf "$VERSION" "$GITHUB_RUN_NUMBER" "$PUBKEY" > "$RUNNER_TEMP/dev.conf.json"

      # NSIS only: the MSI's version can't carry "-dev.N".
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bunx tauri build --bundles nsis -c "$RUNNER_TEMP/dev.conf.json" -- --locked

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CI: 'true' # no Finder scripting for the DMG window
        run: |
          brew install mpv
          bun scripts/bundle-libmpv.ts
          bunx tauri build --bundles app,dmg \
            -c src-tauri/vendor/libmpv/tauri.conf.json \
            -c '{"bundle":{"macOS":{"signingIdentity":"-"}}}' \
            -c "$RUNNER_TEMP/dev.conf.json" \
            -- --locked
      - name: Pack the mpv sources (macOS)
        if: runner.os == 'macOS'
        run: bun scripts/macSources.ts src-tauri/vendor/libmpv/formulae.json "target/release/bundle/Polarity_${VERSION}_aarch64_mpv-sources.tar"

      # No RPM: an RPM's version can't carry "-dev.N", and Tauri can't give the RPM a version of its own.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev file
          bunx tauri build --bundles deb,appimage -c "$RUNNER_TEMP/dev.conf.json" -- --locked

      # As built; the publish job gives them their platform-first, build-numbered names. The .sig
      # files go into the feeds and aren't uploaded.
      - name: Collect the installers
        run: |
          mkdir out
          b=target/release/bundle
          case "$RUNNER_OS" in
            Windows)
              cp "$b"/nsis/*_x64-setup.exe "$b"/nsis/*_x64-setup.exe.sig out/
              cp src-tauri/vendor/mpv-sources/polarity-windows-mpv-sources.tar "out/Polarity_${VERSION}_x64_mpv-sources.tar" ;;
            macOS)
              cp "$b"/dmg/*_aarch64.dmg out/
              cp "$b/macos/Polarity Dev.app.tar.gz" "out/Polarity_${VERSION}_aarch64.app.tar.gz"
              cp "$b/macos/Polarity Dev.app.tar.gz.sig" "out/Polarity_${VERSION}_aarch64.app.tar.gz.sig"
              cp "$b/Polarity_${VERSION}_aarch64_mpv-sources.tar" out/ ;;
            Linux)
              cp "$b"/appimage/*.AppImage "$b"/appimage/*.AppImage.sig "$b"/deb/*.deb out/ ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # The debug APK as a dev build (arm64), kept as an artifact: phones get it from here, not from the release.
  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VITE_POLAR_CHANNEL: dev
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: false # ci.yml's cache, read only
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the Android platform
        run: |
          sdk="$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)"
          pkg="platforms;android-$sdk"; [ "$sdk" -ge 37 ] && pkg="$pkg.0"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$pkg"
      - name: Use the runner's NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?the runner image has no Android NDK}}" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libmpv/out
          key: android-libmpv-${{ hashFiles('scripts/android-mpv.sh') }}
      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          scripts/ci-apt.sh autoconf pkgconf libtool ninja-build gperf nasm
          pipx install meson
          scripts/android-mpv.sh "$RUNNER_TEMP/libmpv" arm64 armv7 x86_64
      - name: Put libmpv in the app
        run: cp -R "$RUNNER_TEMP/libmpv/out/jniLibs" "$RUNNER_TEMP/libmpv/out/assets" src-tauri/gen/android/app/src/main/
      - name: Build
        run: bun run tauri android build --ci --debug --apk --target aarch64 -c "{\"version\":\"$VERSION\"}"
      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14
      - name: Keep libmpv's sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-android-mpv-sources
          path: ${{ runner.temp }}/libmpv/out/polarity-android-mpv-sources.tar.xz
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish the dev build
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # moves the dev tag, updates the "Dev build" entry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit's message names the pull request
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dev-desktop-*
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
        run: bun scripts/devChannel.ts publish release "$VERSION" "$GITHUB_RUN_NUMBER" "$COMMIT"

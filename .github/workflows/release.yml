name: Release

# Builds the installers for Windows, macOS (Apple Silicon) and Linux, the
# Android debug APK and the unsigned iOS IPA, and drafts one GitHub release with
# all of them, named by platform, and the updater's latest.json
# (scripts/release-publish.ts, docs/releasing.md). Not on every commit: ci.yml
# already builds and tests every platform there.
#
#   Release:    (docs/releasing.md) set the version (Cargo.toml, package.json, tauri.conf.json),
#               commit, then  git tag -a v0.18.0 -m "- What's new"  and push the tag.
#               The tag message becomes the release notes. Review the draft, then Publish.
#   Test build: Actions → Release → Run workflow. Installers come back as
#               workflow artifacts; nothing is published. On a fork, a tag
#               drafts the release there.
#
# Needs the updater key as repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the contents of ~/.tauri/polar.key).
# Dev builds of the `dev` branch are dev-build.yml's, with a key of their own.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  actions: read # scripts/fetch-mpv.ts downloads windows-mpv.yml's build

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest # Apple Silicon
          # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Release builds update from the releases; any other build doesn't, or from the dev channel (src/lib/platform/build.ts).
      VITE_POLAR_CHANNEL: release
      # The account backend (scripts/accountEnv.ts): public values, kept as secrets so forks don't build against it.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(bun -e 'console.log(require("./src-tauri/tauri.conf.json").version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version. Set the version, commit, and tag that commit."
            exit 1
          fi
      - name: Check the updater key is set
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      # Without them the app has no sign-in at all (#14).
      - name: Check the account settings are set
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Add the VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY repository secrets: without them the build has no sign-in."
            exit 1
          fi

      # Windows: tauri.conf.json's beforeBuildCommand fetches the pinned mpv build and its sources
      # (windows-mpv.yml for this scripts/windows-mpv.lock must have passed).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bunx tauri build -- --locked

      # macOS: Homebrew's libmpv, bundled into the app by scripts/bundle-libmpv.ts.
      # Ad-hoc signed; not notarized until there's an Apple Developer ID.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CI: 'true' # no Finder scripting for the DMG window
        run: |
          brew install mpv
          bun scripts/bundle-libmpv.ts
          bunx tauri build --bundles app,dmg \
            -c src-tauri/vendor/libmpv/tauri.conf.json \
            -c '{"bundle":{"macOS":{"signingIdentity":"-"}}}' \
            -- --locked

      # macOS: the exact source of mpv and every library bundled with it, with
      # Homebrew's build recipes (docs/licensing.md), attached to the release.
      - name: Pack the mpv sources (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/macSources.ts src-tauri/vendor/libmpv/formulae.json "target/release/bundle/Polarity_${VERSION}_aarch64_mpv-sources.tar"

      # Linux: playback uses the system's mpv (a dependency of the .deb and .rpm).
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev file rpm
          bunx tauri build --bundles deb,rpm,appimage -- --locked

      - name: Collect the installers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir out
          b=target/release/bundle
          case "$RUNNER_OS" in
            Windows)
              cp "$b"/nsis/*_x64-setup.exe "$b"/nsis/*_x64-setup.exe.sig out/
              cp "$b"/msi/*_x64_en-US.msi "$b"/msi/*_x64_en-US.msi.sig out/
              # The exact sources of the bundled mpv.exe (docs/licensing.md).
              cp src-tauri/vendor/mpv-sources/polarity-windows-mpv-sources.tar "out/Polarity_${VERSION}_x64_mpv-sources.tar"
              # The player with its licence texts, for development builds without a signed-in gh (scripts/fetch-mpv.ts, #186).
              (cd src-tauri/vendor/mpv && 7z a -tzip "$GITHUB_WORKSPACE/out/Polarity_${VERSION}_x64_mpv.zip" ./* >/dev/null) ;;
            macOS)
              cp "$b"/dmg/*_aarch64.dmg out/
              # Name the update archive per version and CPU, like the other files.
              cp "$b/macos/Polarity.app.tar.gz" "out/Polarity_${VERSION}_aarch64.app.tar.gz"
              cp "$b/macos/Polarity.app.tar.gz.sig" "out/Polarity_${VERSION}_aarch64.app.tar.gz.sig"
              cp "$b/Polarity_${VERSION}_aarch64_mpv-sources.tar" out/ ;;
            Linux)
              cp "$b"/appimage/*.AppImage "$b"/appimage/*.AppImage.sig "$b"/deb/*.deb "$b"/rpm/*.rpm out/ ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polarity-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # Android: the debug APK for 64-bit phones, as ci.yml builds it (release signing waits for the
  # owner's key), with the sources of the libmpv and FFmpeg inside it.
  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VITE_POLAR_CHANNEL: release
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: false # ci.yml's cache, read only
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the Android platform
        run: |
          sdk="$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)"
          pkg="platforms;android-$sdk"; [ "$sdk" -ge 37 ] && pkg="$pkg.0"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$pkg"
      - name: Use the runner's NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?the runner image has no Android NDK}}" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libmpv/out
          key: android-libmpv-${{ hashFiles('scripts/android-mpv.sh') }}
      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          scripts/ci-apt.sh autoconf pkgconf libtool ninja-build gperf nasm
          pipx install meson
          scripts/android-mpv.sh "$RUNNER_TEMP/libmpv" arm64 armv7 x86_64
      - name: Put libmpv in the app
        run: cp -R "$RUNNER_TEMP/libmpv/out/jniLibs" "$RUNNER_TEMP/libmpv/out/assets" src-tauri/gen/android/app/src/main/
      - name: Build
        run: bun run tauri android build --ci --debug --apk --target aarch64
      - name: Collect the APK
        run: |
          mkdir out
          # Gradle calls it universal whatever it holds; it holds arm64 only (scripts/releaseAssets.ts reads the name).
          cp src-tauri/gen/android/app/build/outputs/apk/*/debug/*-debug.apk out/app-arm64-debug.apk
          cp "$RUNNER_TEMP/libmpv/out/polarity-android-mpv-sources.tar.xz" out/
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polarity-Android
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # iOS: the unsigned IPA, as ci.yml builds it (signing waits for the owner's Apple developer
  # account), with the sources of the libmpv and FFmpeg inside it.
  ios:
    name: Build (iOS)
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      VITE_POLAR_CHANNEL: release
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)
          case "$(basename "$xcode")" in Xcode_2[6-9]*|Xcode_[3-9][0-9]*) ;; *) echo "::error::no Xcode 26 or later here"; ls -d /Applications/Xcode*.app; exit 1 ;; esac
          sudo xcode-select -s "$xcode"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
          save-if: false # ci.yml's cache, read only
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install build tools
        run: brew install meson ninja pkgconf xcodegen
      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-libmpv/out
          key: ios-libmpv-${{ hashFiles('scripts/ios-mpv.sh') }}
      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: scripts/ios-mpv.sh "$RUNNER_TEMP/ios-libmpv" device
      - name: Put libmpv in the app
        run: |
          mkdir -p src-tauri/vendor/ios
          cp -R "$RUNNER_TEMP/ios-libmpv/out/frameworks" "$RUNNER_TEMP/ios-libmpv/out/licenses" src-tauri/vendor/ios/
      - name: Generate the Xcode project
        run: |
          bun run tauri ios init --ci
          bun run tauri icon src-tauri/icons/icon.png --output "$RUNNER_TEMP/icons"
          cp "$RUNNER_TEMP"/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
      - name: Build
        run: bun run tauri ios build --ci --no-sign
      - name: Collect the IPA
        run: |
          mkdir out
          find src-tauri/gen/apple/build -name '*.ipa' -exec cp {} out/ \;
          cp "$RUNNER_TEMP/ios-libmpv/out/polarity-ios-mpv-sources.tar.xz" out/
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polarity-iOS
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # The desktop installers are the release; a phone build that failed is left out (with a
  # warning) and can be attached by hand under its release name (docs/releasing.md).
  publish:
    name: Draft the release
    needs: [build, android, ios]
    if: always() && github.ref_type == 'tag' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: polarity-*
          path: release
          merge-multiple: true
      - name: Phone builds left out
        if: needs.android.result != 'success' || needs.ios.result != 'success'
        run: |
          echo "::warning::Android ${{ needs.android.result }}, iOS ${{ needs.ios.result }}: the draft has no files for what didn't build."
      - name: Release notes from the tag message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [[ "$type" == "tag" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' > notes.md
          else
            : > notes.md # lightweight tag: add the notes on GitHub before publishing
          fi
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-publish.ts "${GITHUB_REF_NAME#v}" release notes.md

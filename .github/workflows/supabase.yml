name: Database

# Applies new migrations (supabase/migrations) and deploys changed Edge Functions (supabase/functions) to
# the Supabase projects (docs/dev-channel.md, "Database changes"; scripts/supabaseDeploy.ts):
#
#   Pull requests:  lists the migrations a merge would apply and checks their versions. No secrets, no database.
#   Push to dev:    the dev project (GitHub environment `supabase-dev`).
#   Push to master: the production project (environment `supabase-production`), once the owner approves the run.
#
# Each environment holds its project's settings: variables SUPABASE_PROJECT_REF and SUPABASE_DB_HOST,
# secrets SUPABASE_DB_PASSWORD and SUPABASE_ACCESS_TOKEN. A job only reads its own environment's, and an
# environment only lets its own branch in. supabase/optional, supabase/admin and supabase/checks stay manual.
on:
  pull_request:
    branches: [dev, master]
    paths: ["supabase/migrations/**", "supabase/functions/**"]
  push:
    branches: [dev, master]
    paths: ["supabase/migrations/**", "supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending:
    name: Migrations a merge would apply
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch, to compare with
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: List them
        env:
          BASE: origin/${{ github.base_ref }}
        run: bun scripts/supabaseDeploy.ts pending "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (${{ github.ref_name }})
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # master waits here for the owner's approval (the environment's required reviewer).
    environment: ${{ github.ref == 'refs/heads/master' && 'supabase-production' || 'supabase-dev' }}
    # One run per project at a time, in push order; a run is never cancelled halfway through.
    concurrency:
      group: supabase-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SUPABASE_ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'supabase-production' || 'supabase-dev' }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the push's first commit, to see what it changed
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: What changed
        id: changes
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bun scripts/supabaseDeploy.ts changes "$BEFORE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1
      - name: Apply the migrations
        if: steps.changes.outputs.migrations == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bun scripts/supabaseDeploy.ts migrations
      - name: Deploy the functions
        if: steps.changes.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS: ${{ steps.changes.outputs.functions }}
        # Word-split on purpose: one argument per function name.
        run: bun scripts/supabaseDeploy.ts functions $FUNCTIONS

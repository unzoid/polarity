name: Windows mpv

# The Windows app's mpv.exe (job windows-mpv below). It runs on every push to master, which keeps
# the build in master's cache, where every branch and pull request restores it from (ci.yml's and
# e2e-app.yml's Windows jobs), and its artifact current for scripts/fetch-mpv.ts and releases.
# Elsewhere it builds only when a branch or pull request changes what the build is made from:
# scripts/windows-mpv.sh, its lock, the image's Dockerfile or this workflow.
on:
  push:
    branches: ['**', '!ui/mobile-polish']
  pull_request:
    paths:
      - 'scripts/windows-mpv*'
      - '.github/workflows/windows-mpv.yml'
  workflow_dispatch:

permissions:
  contents: read

# A run on master is never cancelled, so the build it makes reaches the cache: a newer push waits
# for it. Elsewhere a new push replaces the running build (the work folder it kept stays).
concurrency:
  group: windows-mpv-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Whether to build: on master, by hand, for a pull request (only those that change the inputs
  # start this workflow), and for a branch whose commits since master change them.
  changes:
    name: Windows mpv inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A pull request from a branch of this repository is built by that branch's push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Changed since master
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ] || [ "$GITHUB_EVENT_NAME" != push ]; then
            build=true
          elif git diff --quiet "$(git merge-base origin/master HEAD)" HEAD -- 'scripts/windows-mpv*' .github/workflows/windows-mpv.yml; then
            build=false
          else
            build=true
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  # mpv.exe for the Windows app, built from pinned sources in the image
  # scripts/windows-mpv.Dockerfile describes (mpv-winbuild-cmake's packages from
  # the Arch Linux Archive on a fixed day; scripts/windows-mpv.sh,
  # docs/licensing.md): once per version of the script and its lock, then
  # restored from the cache. The first build also makes the clang toolchain
  # (LLVM, about two hours), kept on its own so a run cut off by the time limit
  # goes on from there. The artifact (mpv.exe, licence texts, the exact sources)
  # is what scripts/fetch-mpv.ts takes for Windows builds and releases.
  windows-mpv:
    name: Windows mpv (pinned build)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # Where the build sees the checkout: the path of the container jobs before,
      # which the work folder's cache (CMake, the toolchain) has written in. The
      # build runs as the runner's user, so the caches can read what it wrote.
      W: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: echo "key=$(cat scripts/windows-mpv.sh scripts/windows-mpv.lock | tr -d '\r' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore this build
        id: built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv/out
          key: windows-mpv-${{ steps.version.outputs.key }}
          enableCrossOsArchive: true
      # The build image, made once per version of its Dockerfile.
      - name: Restore the build image
        id: image
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv-image.tar.zst
          key: windows-mpv-image-${{ hashFiles('scripts/windows-mpv.Dockerfile') }}
      - name: Make the build image
        if: steps.built.outputs.cache-hit != 'true' && steps.image.outputs.cache-hit != 'true'
        run: |
          docker build -t windows-mpv -f scripts/windows-mpv.Dockerfile scripts
          docker save windows-mpv | zstd -T0 -10 -o windows-mpv-image.tar.zst
      - name: Keep the build image
        if: steps.built.outputs.cache-hit != 'true' && steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv-image.tar.zst
          key: windows-mpv-image-${{ hashFiles('scripts/windows-mpv.Dockerfile') }}
      - name: Load the build image
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          docker image inspect windows-mpv >/dev/null 2>&1 || zstd -dc windows-mpv-image.tar.zst | docker load
          rm -f windows-mpv-image.tar.zst
      - name: Restore the work folder
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv
          key: windows-mpv-work-${{ steps.version.outputs.key }}
          restore-keys: windows-mpv-work-
      - name: Build the toolchain
        if: steps.built.outputs.cache-hit != 'true'
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:$W" -w "$W" windows-mpv scripts/windows-mpv.sh windows-mpv toolchain
      - name: Keep the work folder
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv
          key: windows-mpv-work-${{ steps.version.outputs.key }}
      - name: Build mpv
        if: steps.built.outputs.cache-hit != 'true'
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:$W" -w "$W" windows-mpv scripts/windows-mpv.sh windows-mpv
      - name: Keep this build
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv/out
          key: windows-mpv-${{ steps.version.outputs.key }}
          enableCrossOsArchive: true
      # When a repository isn't pinned (or not as the lock says): what the run
      # cloned, to review and copy into scripts/windows-mpv.lock.
      - name: Keep the list of what was cloned
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-lock
          path: windows-mpv/out/windows-mpv.lock
          if-no-files-found: ignore
          retention-days: 14
      # Every package's step logs (the job prints the failed one's), CMake's,
      # autoconf's and FFmpeg's records of their checks, with the commands they
      # ran and the compiler's errors.
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-logs
          path: |
            windows-mpv/ninja.log
            windows-mpv/build/**/*-stamp/*.log
            windows-mpv/build/**/CMakeFiles/CMakeConfigureLog.yaml
            windows-mpv/build/**/config.log
            windows-mpv/src/*/config.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep mpv.exe and its sources
        if: github.ref == 'refs/heads/master' || steps.built.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-${{ steps.version.outputs.key }}
          path: |
            windows-mpv/out/mpv
            windows-mpv/out/polarity-windows-mpv-sources.tar
          compression-level: 0
          retention-days: 90
      # Just the player and its licence texts, for dev builds (fetch-mpv.ts --dev, #186): a tenth of
      # the full one, which is mostly the source archive only releases need.
      - name: Keep mpv.exe on its own
        if: github.ref == 'refs/heads/master' || steps.built.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-bin-${{ steps.version.outputs.key }}
          path: windows-mpv/out/mpv
          retention-days: 90

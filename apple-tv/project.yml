# The Apple TV app's Xcode project, generated by XcodeGen: `xcodegen generate` in this folder, after
# `scripts/apple-tv-core.sh` has written Core/ and `scripts/ios-mpv.sh <work dir> tv-simulator` (or
# tv-device) has written Vendor/ (docs/ARCHITECTURE.md, "Apple TV").
name: PolarityTV
options:
  bundleIdPrefix: app.getpolar
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # Signing in and the account's settings document (#504). MIT; docs/licensing.md.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.18.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is the owner's: set DEVELOPMENT_TEAM in Xcode, or pass it to xcodebuild.
    CODE_SIGN_STYLE: Automatic
targets:
  PolarityTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Core/PolarCore.swift
      # libmpv's and its libraries' licence texts and BUNDLED.txt, and the Swift packages' licences
      # and notices (Notices/PACKAGES.txt), read in Account → Licences.
      - path: Vendor/licenses
        type: folder
        buildPhase: resources
      - path: Notices
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Core/PolarCoreFFI.xcframework
        embed: false
      # The player: libmpv and the LGPL libraries it loads, each a framework of its own embedded in
      # the app so it can be replaced (docs/licensing.md); the list is FRAMEWORKS in scripts/ios-mpv.sh.
      - framework: Vendor/frameworks/Libmpv.xcframework
      - framework: Vendor/frameworks/Libavcodec.xcframework
      - framework: Vendor/frameworks/Libavfilter.xcframework
      - framework: Vendor/frameworks/Libavformat.xcframework
      - framework: Vendor/frameworks/Libavutil.xcframework
      - framework: Vendor/frameworks/Libfribidi.xcframework
      - framework: Vendor/frameworks/Libplacebo.xcframework
      - framework: Vendor/frameworks/Libswresample.xcframework
      - framework: Vendor/frameworks/Libswscale.xcframework
      - package: Supabase
        product: Supabase
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Polarity
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # The account server, from the build settings below; empty: no sign-in, Home with the index's rows.
        PolaritySupabaseURL: $(POLAR_SUPABASE_URL)
        PolaritySupabaseKey: $(POLAR_SUPABASE_KEY)
    settings:
      base:
        # The same identifier as the iPhone and iPad app, so one purchase covers both.
        PRODUCT_BUNDLE_IDENTIFIER: app.getpolar.desktop
        PRODUCT_NAME: Polarity
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        # The account server's URL and publishable key, as VITE_SUPABASE_URL and
        # VITE_SUPABASE_PUBLISHABLE_KEY are for the other apps: set them in Xcode or pass them to
        # xcodebuild (`POLAR_SUPABASE_URL=https://…`). CI's simulator build leaves them empty.
        POLAR_SUPABASE_URL: ""
        POLAR_SUPABASE_KEY: ""

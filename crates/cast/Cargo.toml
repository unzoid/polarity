[package]
name = "polar-cast"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Google Cast sender: finds Chromecasts on the network and plays a link on one (Default Media Receiver)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros", "rt"] }
# TLS to the receiver (port 8009). Already in the build through reqwest and the torrent engine; ring as
# reqwest has it (aws-lc would need NASM on Windows when this crate is built on its own).
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
# Finding receivers: mDNS `_googlecast._tcp`. MIT OR Apache-2.0.
mdns-sd = "0.21"
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

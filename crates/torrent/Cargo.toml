[package]
name = "polar-torrent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Apache-2.0. rustls rather than the platform's TLS; no web UI or HTTP API.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
bytes = "1"
getrandom = "0.3"
serde.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
# rustls' crypto (aws-lc) assembles its x86-64 code with NASM, which Windows build machines lack: use the
# objects aws-lc ships prebuilt instead.
aws-lc-sys = { version = "0.47", features = ["prebuilt-nasm"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Passkey — Polarity</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0a0d" />
    <link rel="icon" href="/icon.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0d;
        --surface: rgba(255, 255, 255, 0.045);
        --border: rgba(255, 255, 255, 0.09);
        --ink: #f4f4f6;
        --muted: rgba(244, 244, 246, 0.58);
        --accent: #7f78ff;
        --accent-hover: #908aff;
        --danger: #ff7a84;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(75% 48% at 50% 0%, rgba(105, 96, 232, 0.28), rgba(62, 54, 152, 0.08) 45%, transparent 72%),
          var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .mark {
        display: inline-block;
        height: 36px;
        margin-bottom: 24px;
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(142, 134, 255, 0.14);
        color: #a7abff;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      p.sub {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 14.5px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button.primary {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(90deg, #8b83ff, #6b64f5);
        color: #fff;
        font: 600 15px/1 inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: opacity 0.15s ease, transform 0.12s ease, filter 0.15s ease;
      }
      button.primary:hover:not(:disabled) {
        filter: brightness(1.07);
      }
      button.primary:active:not(:disabled) {
        transform: scale(0.99);
      }
      button.primary:disabled {
        opacity: 0.7;
        cursor: default;
      }
      button.secondary {
        border: 0;
        background: none;
        color: var(--muted);
        font: 500 14px/1.4 inherit;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: color 0.15s ease;
      }
      button.secondary:hover {
        color: var(--ink);
      }
      .error {
        margin: 16px 0 0;
        min-height: 20px;
        font-size: 13.5px;
        color: var(--danger);
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 260 100" fill="none" aria-label="Polarity">
        <path
          d="M13.88 85.08V39.256H22.008V43.672C23.2453 41.9653 24.7813 40.6853 26.616 39.832C28.4933 38.936 30.52 38.488 32.696 38.488C35.768 38.488 38.392 39.2347 40.568 40.728C42.7867 42.2213 44.472 44.2267 45.624 46.744C46.8187 49.2187 47.416 51.9707 47.416 55C47.416 58.0293 46.8187 60.824 45.624 63.384C44.4293 65.944 42.7227 67.992 40.504 69.528C38.328 71.0213 35.7253 71.768 32.696 71.768C30.008 71.768 27.768 71.2133 25.976 70.104C24.2267 68.9947 22.9253 67.8427 22.072 66.648V85.08H13.88ZM30.52 64.6C32.2267 64.6 33.72 64.1733 35 63.32C36.28 62.424 37.2827 61.2507 38.008 59.8C38.7333 58.3493 39.096 56.7493 39.096 55C39.096 52.9947 38.6907 51.3093 37.88 49.944C37.112 48.536 36.0667 47.4693 34.744 46.744C33.464 46.0187 32.056 45.656 30.52 45.656C28.8987 45.656 27.448 46.0613 26.168 46.872C24.888 47.6827 23.864 48.8133 23.096 50.264C22.3707 51.672 22.008 53.2933 22.008 55.128C22.008 56.8773 22.3707 58.4773 23.096 59.928C23.8213 61.3787 24.824 62.5307 26.104 63.384C27.384 64.1947 28.856 64.6 30.52 64.6ZM94.7003 71V26.2H102.892V71H94.7003ZM120.428 71.768C118.551 71.768 116.802 71.384 115.18 70.616C113.559 69.848 112.236 68.76 111.212 67.352C110.231 65.9013 109.74 64.1947 109.74 62.232C109.74 59.8853 110.316 57.9653 111.468 56.472C112.62 54.9787 114.199 53.8693 116.204 53.144C118.252 52.4187 120.535 52.056 123.052 52.056H130.604C130.604 50.6053 130.37 49.3893 129.9 48.408C129.474 47.4267 128.812 46.68 127.916 46.168C127.063 45.6133 125.996 45.336 124.716 45.336C123.223 45.336 121.879 45.6773 120.684 46.36C119.532 47 118.828 48.088 118.572 49.624H110.38C110.594 47.32 111.383 45.336 112.748 43.672C114.114 42.008 115.863 40.728 117.996 39.832C120.13 38.936 122.412 38.488 124.844 38.488C127.831 38.488 130.348 39.0427 132.396 40.152C134.487 41.2613 136.087 42.84 137.196 44.888C138.306 46.8933 138.86 49.2827 138.86 52.056V61.72C138.946 62.6587 139.287 63.2987 139.884 63.64C140.482 63.9813 141.271 64.152 142.252 64.152V71C140.247 71 138.562 70.808 137.196 70.424C135.874 70.04 134.786 69.4853 133.932 68.76C133.079 67.992 132.354 67.032 131.756 65.88C130.775 67.544 129.239 68.952 127.148 70.104C125.1 71.2133 122.86 71.768 120.428 71.768ZM122.796 65.176C124.204 65.176 125.484 64.856 126.636 64.216C127.831 63.576 128.791 62.68 129.516 61.528C130.242 60.376 130.604 59.0533 130.604 57.56V57.304H123.564C122.626 57.304 121.73 57.4533 120.876 57.752C120.023 58.008 119.34 58.4347 118.828 59.032C118.316 59.5867 118.06 60.3547 118.06 61.336C118.06 62.6587 118.508 63.64 119.404 64.28C120.343 64.8773 121.474 65.176 122.796 65.176ZM148.2 71V39.256H156.328V43.992C157.438 42.2 158.846 40.8347 160.552 39.896C162.259 38.9573 164.158 38.488 166.248 38.488V47.064H164.072C161.47 47.064 159.528 47.6827 158.248 48.92C156.968 50.1573 156.328 52.2267 156.328 55.128V71H148.2ZM176.491 35.16C175.041 35.16 173.782 34.648 172.715 33.624C171.691 32.5573 171.179 31.2987 171.179 29.848C171.179 28.3547 171.691 27.096 172.715 26.072C173.782 25.048 175.041 24.536 176.491 24.536C177.985 24.536 179.243 25.048 180.267 26.072C181.291 27.096 181.803 28.3547 181.803 29.848C181.803 31.2987 181.291 32.5573 180.267 33.624C179.243 34.648 177.985 35.16 176.491 35.16ZM172.395 71V39.256H180.587V71H172.395ZM201.055 71C197.642 71 195.061 70.168 193.311 68.504C191.605 66.84 190.751 64.344 190.751 61.016V46.104H186.655V39.256H190.751V31.512H198.943V39.256H206.175V46.104H198.943V61.08C198.943 62.2747 199.263 63.0853 199.903 63.512C200.543 63.9387 201.375 64.152 202.399 64.152H206.175V71H201.055ZM215.957 85.08L222.933 69.528L210.069 39.256H219.221L227.413 60.888L235.797 39.256H244.437L224.597 85.08H215.957Z"
          fill="white"
        />
        <path d="M71 28L65 44L49 50L65 56L71 72L77 56L93 50L77 44L71 28Z" fill="#A7ABFF" />
      </svg>

      <div class="badge" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" />
          <path d="M3.5 18.5c.6-3.1 2.9-5 5.5-5 1.1 0 2.1.3 3 .8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="17.5" cy="14" r="2.3" stroke="currentColor" stroke-width="1.8" />
          <path d="M17.5 16.3V21M17.5 19.2h2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </div>

      <h1 id="title">Continue with Passkey</h1>
      <p id="sub" class="sub">Complete passkey verification to return to Polarity.</p>

      <div id="actions" class="actions">
        <button id="go" type="button" class="primary">Continue with Passkey</button>
        <button id="cancel" type="button" class="secondary">Cancel</button>
      </div>

      <p id="error" class="error" role="alert"></p>
    </main>

    <script>
      (function () {
        const CALLBACK_RE = /^http:\/\/127\.0\.0\.1:\d{1,5}\/callback$/;
        const titleEl = document.getElementById("title");
        const subEl = document.getElementById("sub");
        const actionsEl = document.getElementById("actions");
        const goBtn = document.getElementById("go");
        const cancelBtn = document.getElementById("cancel");
        const errorEl = document.getElementById("error");

        function base64UrlToBytes(str) {
          const pad = str.length % 4 === 0 ? "" : "=".repeat(4 - (str.length % 4));
          const b64 = str.replace(/-/g, "+").replace(/_/g, "/") + pad;
          const bin = atob(b64);
          const out = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
          return out;
        }

        function bytesToBase64Url(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
        }

        function utf8ToBase64Url(text) {
          return bytesToBase64Url(new TextEncoder().encode(text));
        }

        function parseRequest() {
          const hash = location.hash.startsWith("#") ? location.hash.slice(1) : "";
          if (!hash) return null;
          try {
            history.replaceState(null, "", location.pathname + location.search);
          } catch (_e) {}
          try {
            const json = new TextDecoder().decode(base64UrlToBytes(hash));
            const data = JSON.parse(json);
            if (!data || typeof data !== "object") return null;
            if (data.mode !== "register" && data.mode !== "authenticate") return null;
            if (!data.options || typeof data.options !== "object") return null;
            if (typeof data.state !== "string" || data.state.length < 16) return null;
            if (typeof data.callback !== "string" || !CALLBACK_RE.test(data.callback)) return null;
            return data;
          } catch (_e) {
            return null;
          }
        }

        function deserializeCreation(opts) {
          if (typeof PublicKeyCredential !== "undefined" && typeof PublicKeyCredential.parseCreationOptionsFromJSON === "function") {
            return PublicKeyCredential.parseCreationOptionsFromJSON(opts);
          }
          const copy = Object.assign({}, opts, {
            challenge: base64UrlToBytes(opts.challenge).buffer,
            user: Object.assign({}, opts.user, { id: base64UrlToBytes(opts.user.id).buffer }),
          });
          if (Array.isArray(opts.excludeCredentials)) {
            copy.excludeCredentials = opts.excludeCredentials.map(function (c) {
              return Object.assign({}, c, { id: base64UrlToBytes(c.id).buffer, type: c.type || "public-key" });
            });
          }
          return copy;
        }

        function deserializeRequest(opts) {
          if (typeof PublicKeyCredential !== "undefined" && typeof PublicKeyCredential.parseRequestOptionsFromJSON === "function") {
            return PublicKeyCredential.parseRequestOptionsFromJSON(opts);
          }
          const copy = Object.assign({}, opts, {
            challenge: base64UrlToBytes(opts.challenge).buffer,
          });
          if (Array.isArray(opts.allowCredentials)) {
            copy.allowCredentials = opts.allowCredentials.map(function (c) {
              return Object.assign({}, c, { id: base64UrlToBytes(c.id).buffer, type: c.type || "public-key" });
            });
          }
          return copy;
        }

        function serializeCreation(cred) {
          if (typeof cred.toJSON === "function") return cred.toJSON();
          const res = {
            attestationObject: bytesToBase64Url(new Uint8Array(cred.response.attestationObject)),
            clientDataJSON: bytesToBase64Url(new Uint8Array(cred.response.clientDataJSON)),
          };
          if (typeof cred.response.getTransports === "function") {
            res.transports = cred.response.getTransports();
          }
          return {
            id: cred.id,
            rawId: cred.id,
            type: "public-key",
            response: res,
            clientExtensionResults: typeof cred.getClientExtensionResults === "function" ? cred.getClientExtensionResults() : {},
            authenticatorAttachment: cred.authenticatorAttachment || undefined,
          };
        }

        function serializeRequest(cred) {
          if (typeof cred.toJSON === "function") return cred.toJSON();
          const r = cred.response;
          return {
            id: cred.id,
            rawId: cred.id,
            type: "public-key",
            response: {
              authenticatorData: bytesToBase64Url(new Uint8Array(r.authenticatorData)),
              clientDataJSON: bytesToBase64Url(new Uint8Array(r.clientDataJSON)),
              signature: bytesToBase64Url(new Uint8Array(r.signature)),
              userHandle: r.userHandle ? bytesToBase64Url(new Uint8Array(r.userHandle)) : undefined,
            },
            clientExtensionResults: typeof cred.getClientExtensionResults === "function" ? cred.getClientExtensionResults() : {},
            authenticatorAttachment: cred.authenticatorAttachment || undefined,
          };
        }

        function sendBack(req, params) {
          const qs = new URLSearchParams(Object.assign({ state: req.state }, params));
          window.location.href = req.callback + "?" + qs.toString();
        }

        const req = parseRequest();
        if (!req) {
          titleEl.textContent = "This link isn't valid";
          subEl.textContent = "Start passkey setup or sign-in again from the Polarity app.";
          actionsEl.hidden = true;
          return;
        }

        const isRegister = req.mode === "register";
        titleEl.textContent = isRegister ? "Add a passkey" : "Sign in with a passkey";
        subEl.textContent = isRegister
          ? "Confirm with Touch ID, Windows Hello, or a security key to save a passkey for Polarity."
          : "Verify with your passkey to sign in to Polarity.";
        goBtn.textContent = isRegister ? "Add Passkey" : "Sign In with Passkey";

        if (
          typeof window.PublicKeyCredential !== "function" ||
          !navigator.credentials ||
          typeof navigator.credentials.create !== "function" ||
          typeof navigator.credentials.get !== "function"
        ) {
          errorEl.textContent = "This browser doesn't support passkeys.";
          goBtn.disabled = true;
          return;
        }

        let busy = false;
        function setBusy(next) {
          busy = next;
          goBtn.disabled = next;
          if (next) {
            goBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Waiting for passkey\u2026</span>';
          } else {
            goBtn.textContent = isRegister ? "Add Passkey" : "Sign In with Passkey";
          }
        }

        async function runCeremony() {
          if (busy) return;
          errorEl.textContent = "";
          setBusy(true);
          try {
            let serialized;
            if (isRegister) {
              const publicKey = deserializeCreation(req.options);
              const cred = await navigator.credentials.create({ publicKey: publicKey });
              if (!cred) throw new Error("No passkey was created.");
              serialized = serializeCreation(cred);
            } else {
              const publicKey = deserializeRequest(req.options);
              const cred = await navigator.credentials.get({ publicKey: publicKey });
              if (!cred) throw new Error("No passkey was selected.");
              serialized = serializeRequest(cred);
            }
            sendBack(req, { payload: utf8ToBase64Url(JSON.stringify(serialized)) });
          } catch (err) {
            setBusy(false);
            const name = err && err.name ? String(err.name) : "";
            if (name === "InvalidStateError") {
              sendBack(req, { error: "already_registered" });
              return;
            }
            if (name === "SecurityError") {
              errorEl.textContent =
                "Passkeys aren't allowed for this origin (" + location.origin + "). Check Relying Party ID and Origins in Supabase.";
              return;
            }
            if (name === "NotAllowedError" || name === "AbortError") {
              errorEl.textContent = "Passkey prompt was cancelled. Try again or click Cancel to return to Polarity.";
              return;
            }
            errorEl.textContent = (err && err.message) || "Passkey verification didn't finish. Try again.";
          }
        }

        goBtn.addEventListener("click", runCeremony);
        cancelBtn.addEventListener("click", function () {
          sendBack(req, { error: "cancelled" });
        });
        goBtn.focus();
      })();
    </script>
  </body>
</html>
